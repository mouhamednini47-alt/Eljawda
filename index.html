<style>
:root{--bg:#fff;--bg2:#f4f7f1;--tx:#15200f;--mu:#5d6b54;--br:#e1e8db;--g:#36801a;--gd:#2a6614;--red:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10150d;--bg2:#182113;--tx:#eef3ea;--mu:#a4b39a;--br:#2a3623;--g:#6fbe45;--gd:#8bd15f}}
:root[data-theme="dark"]{--bg:#10150d;--bg2:#182113;--tx:#eef3ea;--mu:#a4b39a;--br:#2a3623;--g:#6fbe45;--gd:#8bd15f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7;padding-bottom:92px;-webkit-font-smoothing:antialiased}
.w{max-width:520px;margin:0 auto;padding:0 18px}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;max-width:520px;margin:auto}
header img{width:40px;height:40px;border-radius:50%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
header b{font-size:18px;font-weight:700;flex:1}
header a{font-size:14px;font-weight:600;color:var(--g);text-decoration:none;border:1px solid var(--br);padding:6px 12px;border-radius:999px}
.gal{max-width:520px;margin:0 auto;position:relative;background:var(--bg2)}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;direction:ltr;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sl::-webkit-scrollbar{display:none}
.sl img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center}
.sl .ph{display:grid;place-items:center;flex:0 0 100%;aspect-ratio:1/1}.sl .ph img{width:34%;flex:none;aspect-ratio:1;border-radius:50%;opacity:.9}
.badge{position:absolute;top:14px;inset-inline-start:14px;background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px}
.cnt{position:absolute;top:14px;inset-inline-end:14px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:3px 10px;border-radius:999px;direction:ltr}
.dots{position:absolute;bottom:12px;inset-inline:0;display:flex;justify-content:center;gap:6px;direction:ltr}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.7);transition:all .25s}.dots i.on{width:22px;background:#fff}
.th{display:flex;gap:8px;padding:10px 18px;max-width:520px;margin:auto;justify-content:center}
.th img{width:62px;height:62px;border-radius:10px;object-fit:cover;border:2px solid transparent;opacity:.6;transition:.2s;cursor:pointer}.th img.on{border-color:var(--g);opacity:1}
h1{font-size:25px;font-weight:700;line-height:1.4;margin:16px 0 6px}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price .now{font-size:30px;font-weight:700;color:var(--g)}.price .old{color:var(--mu);text-decoration:line-through;font-size:18px}
.desc{color:var(--mu);margin:10px 0 0;white-space:pre-line}
.offer{margin:22px 0;border:1px solid var(--br);border-radius:16px;padding:16px;background:var(--bg2);text-align:center}
.offer p{font-size:14px;color:var(--mu)}
.cd{display:flex;justify-content:center;gap:10px;margin:10px 0;direction:ltr}
.cd div{background:var(--bg);border:1px solid var(--br);border-radius:12px;min-width:62px;padding:8px 0}
.cd b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}.cd span{font-size:11px;color:var(--mu)}
h2{font-size:19px;margin:28px 0 10px;font-weight:700}
ul.f{list-style:none;padding:0;display:grid;gap:8px}
ul.f li{padding-inline-start:26px;position:relative}
ul.f li:before{content:"";position:absolute;inset-inline-start:2px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--g)}
.box{border:1px solid var(--br);border-radius:14px;padding:14px 16px}
details{border-bottom:1px solid var(--br);padding:12px 0}
summary{cursor:pointer;font-weight:600;list-style:none}summary::after{content:"+";float:left;color:var(--g);font-size:20px;line-height:1}
details[open] summary::after{content:"\2212"}details p{color:var(--mu);margin-top:6px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:18px;padding:15px;cursor:pointer;transition:transform .15s,background .2s;text-align:center;text-decoration:none}
.btn:active{transform:scale(.98)}.btn:hover{background:var(--gd)}
.btn.o{background:none;color:var(--g);border:1.5px solid var(--g);font-size:16px;padding:12px;margin-top:10px}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--bg);border-top:1px solid var(--br);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:520px;margin:auto;display:flex;gap:12px;align-items:center}.bar .p{font-weight:700;font-size:18px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 20px}
.card{text-decoration:none;color:inherit;border:1px solid var(--br);border-radius:16px;overflow:hidden;background:var(--bg);display:block}
.card img,.card .ph0{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--bg2);display:block}
.card .ph0{display:grid;place-items:center}.card .ph0 img{width:40%;height:auto;aspect-ratio:1;border-radius:50%}
.card div.i{padding:10px 12px}.card b{display:block;font-size:15px;line-height:1.4}.card .now{color:var(--g);font-weight:700}.card .old{color:var(--mu);text-decoration:line-through;font-size:13px;margin-inline-start:6px}
dialog{border:0;padding:0;width:100%;max-width:520px;margin:auto auto 0;border-radius:22px 22px 0 0;background:var(--bg);color:var(--tx);animation:up .3s ease}
dialog::backdrop{background:rgba(0,0,0,.5)}@keyframes up{from{transform:translateY(40px);opacity:0}}
.fm{padding:22px 18px 26px;display:grid;gap:12px}.fm h3{font-size:20px}
label{font-size:14px;font-weight:600;display:grid;gap:5px}
input,textarea,select{font:inherit;font-size:16px;border:1px solid var(--br);border-radius:12px;padding:11px;background:var(--bg);color:var(--tx);width:100%}
input:focus,textarea:focus{outline:2px solid var(--g);border-color:transparent}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--g)}
.q{display:flex;align-items:center;gap:10px}.q button{width:42px;height:42px;border-radius:12px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:20px}.q span{min-width:30px;text-align:center;font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:6px 0}
.x{background:none;border:0;color:var(--mu);font:inherit;padding:6px;cursor:pointer}
.ok{text-align:center;padding:34px 20px}.ok h3{color:var(--g);margin-bottom:8px}
.err{color:var(--red);font-size:13px;min-height:18px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 0 10px}
.fade{animation:fd .5s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
#toast{position:fixed;top:18px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;display:none;font-size:14px}
#adm{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:0 0 40px}#adm.show{display:block}
#adm .top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--br);padding:12px 18px;display:flex;gap:8px;align-items:center;z-index:2}
#adm .top b{flex:1}#adm .top button{width:auto;padding:9px 14px;font-size:14px;border-radius:10px}
#adm .in{max-width:620px;margin:auto;padding:16px 18px;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--br);background:var(--bg2);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.imgs{display:flex;gap:10px}.imgs .s{position:relative;width:90px;height:90px;border-radius:12px;border:1px dashed var(--br);overflow:hidden;background:var(--bg2);display:grid;place-items:center;font-size:12px;color:var(--mu)}
.imgs img{width:100%;height:100%;object-fit:cover}.imgs button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff}
.note{font-size:13px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--br);position:sticky;top:58px;background:var(--bg);z-index:2}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{border:1px solid var(--br);border-radius:14px;padding:12px;background:var(--bg2)}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--mu)}
.oc{border:1px solid var(--br);border-radius:14px;padding:12px;display:grid;gap:6px;font-size:15px}.oc .h{display:flex;justify-content:space-between;font-weight:700}.oc a{color:var(--g);font-weight:600;text-decoration:none}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--br);text-align:start;white-space:nowrap}
.soc{display:flex;gap:16px;justify-content:center;margin-bottom:8px}.soc a{color:var(--g);text-decoration:none;font-weight:600}
</style>

function list(){
 document.title=ST.name||"الجودة";
 $("app").innerHTML='<div class="w fade"><h1>جميع المنتجات</h1>'+(PRODS.length?'<div class="grid">'+PRODS.map(function(p){
  return '<a class="card" data-nav href="?p='+esc(p.slug)+'">'+(p.images&&p.images[0]?'<img loading="lazy" src="'+esc(p.images[0])+'" alt="">':'<div class="ph0"><img src="'+logo()+'" alt=""></div>')+'<div class="i"><b>'+esc(p.name)+'</b><span class="now">'+fmt(p.price)+'</span>'+(p.old_price>p.price?'<span class="old">'+fmt(p.old_price)+'</span>':'')+'</div></a>'}).join("")+'</div>':'<p class="desc">لا توجد منتجات حاليًا.</p>')+'</div>'}

function endTime(){
 if(P.ends_at)return new Date(P.ends_at).getTime();
 var k="cd_"+P.id+"_"+P.duration_hours,v=null;try{v=localStorage.getItem(k)}catch(e){}
 if(!v){v=String(Date.now()+P.duration_hours*36e5);try{localStorage.setItem(k,v)}catch(e){}}return+v}
function product(p){
 P=p;document.title=p.name+" - "+(ST.name||"");
 pixel("ViewContent",{content_name:p.name,content_ids:[p.id],content_type:"product",value:p.price,currency:"MRU"});

 var im=p.images||[],disc=p.old_price>p.price?Math.round((1-p.price/p.old_price)*100):0,out=p.stock!=null&&p.stock<=0,

 var wa=p.whatsapp_on&&ST.whatsapp?'<a class="btn o" target="_blank" rel="noopener" href="https://wa.me/'+esc(ST.whatsapp)+'?text='+encodeURIComponent("مرحبًا، أريد الاستفسار عن: "+p.name)+'">تواصل عبر واتساب</a>':'',
 bt=out?'نفدت الكمية':esc(p.btn_text||"اطلب الآن"),dis=out?' disabled style="opacity:.5"':'';
 $("app").innerHTML=g+'<div class="w fade"><h1>'+esc(p.name)+'</h1><div class="price"><span class="now">'+fmt(p.price)+'</span>'+(disc?'<span class="old">'+fmt(p.old_price)+'</span>':'')+'</div><p class="desc">'+esc(p.description)+'</p>'+
 (showT?'<div class="offer"><p>'+esc(p.timer_text||"عرض خاص")+'</p><div class="cd" id="cd"></div><p id="cdm">العرض ينتهي عند انتهاء العداد</p></div>':'')+
 (p.features&&p.features.length?'<h2>المميزات</h2><ul class="f">'+p.features.map(function(f){return '<li>'+esc(f)+'</li>'}).join("")+'</ul>':'')+
 '<h2>معلومات التوصيل</h2><div class="box">'+esc(p.delivery_info||ST.delivery)+'</div>'+
 (p.faq&&p.faq.length?'<h2>أسئلة وأجوبة</h2>'+p.faq.map(function(q){return '<details><summary>'+esc(q[0])+'</summary><p>'+esc(q[1])+'</p></details>'}).join(""):'')+'<div id="rv"></div>'+
 '<div style="height:22px"></div><button class="btn" data-order'+dis+'>'+bt+'</button>'+wa+'<a class="btn o" data-nav href="?all=1">عرض جميع المنتجات</a></div>'+
 '<div class="bar"><div class="in"><div class="p">'+fmt(p.price)+'</div><button class="btn" data-order'+dis+'>'+bt+'</button></div></div>';
 if(!out)document.querySelectorAll("[data-order]").forEach(function(b){b.onclick=openForm});

 '<label>العنوان<input name="a" placeholder="مثال: تغرغ زينه، عرفات، ملح"></label>'+
 '<label>الكمية<div class="q"><button type="button" id="m">&minus;</button><span id="qv">1</span><button type="button" id="pl">+</button></div></label>'+
 '<label>ملاحظات (اختياري)<textarea name="o" rows="2"></textarea></label><div class="tot"><span>الإجمالي</span><span id="tt">'+fmt(P.price)+'</span></div><div class="err" id="er"></div>'+
 '<button class="btn" id="sbm" type="submit">تأكيد الطلب</button><button class="x" type="button" id="cl">إغلاق</button></form>';
 var up=function(){$("qv").textContent=qty;$("tt").textContent=fmt(P.price*qty)};
 $("m").onclick=function(){if(qty>1){qty--;up()}};$("pl").onclick=function(){if(qty<20){qty++;up()}};$("cl").onclick=function(){$("dlg").close()};
 $("f").onsubmit=async function(e){e.preventDefault();var f=e.target,n=f.n.value.trim(),t=f.t.value.replace(/[\s-]/g,""),a=f.a.value.trim();
  if(!n||!/^\+?\d{8,15}$/.test(t)||!a){$("er").textContent="يرجى إدخال الاسم ورقم هاتف صحيح والعنوان.";return}
  $("sbm").disabled=true;$("sbm").textContent="جارٍ الإرسال...";
  var r=await sb.from("orders").insert({product_id:P.id,name:n,phone:t,address:a,qty:qty,notes:f.o.value.trim()||null});
  if(r.error){$("sbm").disabled=false;$("sbm").textContent="تأكيد الطلب";$("er").textContent="تعذر إرسال الطلب. حاول مرة أخرى أو تواصل معنا عبر واتساب.";return}
  pixel("Purchase",{value:P.price*qty,currency:"MRU",content_ids:[P.id],content_type:"product"});
  $("dbody").innerHTML='<div class="ok"><h3>تم استلام طلبك بنجاح</h3><p>شكرًا لك، سنتصل بك قريبًا لتأكيد الطلب وترتيب التوصيل.</p><br><button class="btn" id="all">عرض جميع المنتجات</button><button class="x" id="cl2">البقاء في الصفحة</button></div>';
  $("all").onclick=function(){$("dlg").close();history.pushState(0,"","?all=1");route()};$("cl2").onclick=function(){$("dlg").close()}};
 $("dlg").showModal()}

/* ===== الدخول المخفي: 4 ضغطات على الشعار ===== */
var taps=0,tt=0;
$("logo").addEventListener("click",function(){taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},2000);if(taps>=4){taps=0;openLogin()}});
async function isAdm(){var r=await sb.from("admins").select("id").maybeSingle();return!!(r.data&&r.data.id)}
async function openLogin(){
 var s=(await sb.auth.getSession()).data.session;if(s&&await isAdm())return aGo("dash");
 $("dbody").innerHTML='<form class="fm" id="lf"><h3>دخول الإدارة</h3><label>رقم الدخول<input name="u" inputmode="numeric" autocomplete="username"></label><label>كلمة المرور<input name="p" type="password" autocomplete="current-password"></label><div class="err" id="er"></div><button class="btn" type="submit">دخول</button><button class="x" type="button" id="cl">إغلاق</button></form>';
 $("cl").onclick=function(){$("dlg").close()};
 $("lf").onsubmit=async function(e){e.preventDefault();var f=e.target;$("er").textContent="";
  var r=await sb.auth.signInWithPassword({email:f.u.value.trim()+"@"+C.ADMIN_EMAIL_DOMAIN,password:f.p.value});
  if(r.error||!(await isAdm())){await sb.auth.signOut();$("er").textContent="بيانات الدخول غير صحيحة.";return}
  $("dlg").close();aGo("dash")};
 $("dlg").showModal()}

/* ===== لوحة الإدارة ===== */
var AD={tab:"dash",of:"active",q:"",orders:[],stats:[],prods:[],ed:null,rv:""};
var TABS=[["dash","الرئيسية"],["orders","الطلبات"],["prods","المنتجات"],["set","الإعدادات"]];
function toLocal(i){return i?new Date(new Date(i)-new Date(i).getTimezoneOffset()*6e4).toISOString().slice(0,16):""}
async function aGo(tab){
 AD.tab=tab;AD.ed=null;$("adm").className="show";document.body.style.overflow="hidden";$("adm").innerHTML='<div class="in">جارٍ التحميل...</div>';
 if(tab==="dash"||tab==="orders"){AD.orders=(await sb.from("orders").select("*").order("created_at",{ascending:false}).limit(2000)).data||[]}
 if(tab==="dash"){AD.stats=(await sb.rpc("admin_stats")).data||[]}
 if(tab==="prods"){AD.prods=(await sb.from("products").select("*").order("created_at",{ascending:false})).data||[]}
 aR()}
function aR(){
 var h='<div class="top"><b>لوحة الإدارة</b><button class="btn o" style="margin:0" id="lo">خروج</button></div><div class="tabs">'+TABS.map(function(t){return '<button class="chip'+(AD.tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div><div class="in">';
 h+=AD.tab==="dash"?vDash():AD.tab==="orders"?vOrders():AD.tab==="prods"?(AD.ed?vEdit():vProds()):vSet();
 $("adm").innerHTML=h+'</div>'}
function cnt(f){return AD.orders.filter(f).length}
function vDash(){
 var o=AD.orders,V=AD.stats.reduce(function(a,s){return a+Number(s.views)},0),proc=cnt(function(x){return["called","confirmed","preparing","shipping"].indexOf(x.status)>-1}),
 rev=o.filter(function(x){return x.status==="delivered"}).reduce(function(a,x){return a+Number(x.total)},0),
 S=[["إجمالي الطلبات",o.length],["طلبات جديدة",cnt(function(x){return x.status==="new"})],["قيد المعالجة",proc],["تم التسليم",cnt(function(x){return x.status==="delivered"})],["ملغاة",cnt(function(x){return x.status==="cancelled"})],["عدد المنتجات",AD.stats.length],["زيارات المنتجات",V],["معدل التحويل",V?(o.length/V*100).toFixed(1)+"%":"0%"],["مبيعات مسلَّمة",fmt(rev)]];
 return '<div class="stats">'+S.map(function(s){return '<div class="stat"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>'}).join("")+'</div><h2 style="margin:10px 0 0">أداء المنتجات</h2><div class="tw"><table><tr><th>المنتج</th><th>زيارات</th><th>طلبات</th><th>مؤكدة</th><th>ملغاة</th><th>تحويل</th></tr>'+
 AD.stats.slice().sort(function(a,b){return b.orders-a.orders}).map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+s.views+'</td><td>'+s.orders+'</td><td>'+s.confirmed+'</td><td>'+s.cancelled+'</td><td>'+(s.views>0?(s.orders/s.views*100).toFixed(1)+"%":"-")+'</td></tr>'}).join("")+'</table></div>'}
var OF=[["active","النشطة"],["delivered","تم التسليم"],["cancelled","ملغاة"],["all","الكل"]];
function ofil(x){return AD.of==="all"||(AD.of==="active"?x.status!=="delivered"&&x.status!=="cancelled":x.status===AD.of)}
function vOrders(){
 var q=AD.q.trim().toLowerCase(),L=AD.orders.filter(function(x){return ofil(x)&&(!q||(x.name+" "+x.phone+" "+x.num+" "+(x.product_name||"")).toLowerCase().indexOf(q)>-1)});
 return '<div class="row">'+OF.map(function(f){return '<button class="chip'+(AD.of===f[0]?' on':'')+'" data-of="'+f[0]+'">'+f[1]+' ('+cnt(function(x){return f[0]==="all"||(f[0]==="active"?x.status!=="delivered"&&x.status!=="cancelled":x.status===f[0])})+')</button>'}).join("")+'</div>'+
 '<input id="sq" placeholder="بحث بالاسم أو الهاتف أو رقم الطلب" value="'+esc(AD.q)+'">'+(L.length?L.map(function(x){
  return '<div class="oc"><div class="h"><span>طلب #'+x.num+'</span><span>'+fmt(x.total)+'</span></div><div>'+esc(x.name)+' — <a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a> — <a target="_blank" rel="noopener" href="https://wa.me/'+esc(x.phone.replace(/^\+/,""))+'">واتساب</a></div><div>'+esc(x.address)+'</div><div>'+esc(x.product_name||"")+' × '+x.qty+'</div>'+(x.notes?'<div class="note">ملاحظات: '+esc(x.notes)+'</div>':'')+'<div class="note">'+new Date(x.created_at).toLocaleString("ar")+'</div>'+
  '<select data-st="'+x.id+'">'+STS.map(function(s){return '<option value="'+s[0]+'"'+(x.status===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join("")+'</select></div>'}).join(""):'<p class="note">لا توجد طلبات في هذا القسم.</p>')}
function vProds(){
 return '<button class="btn" data-a="new">+ منتج جديد</button>'+AD.prods.map(function(p){return '<div class="oc"><div class="h"><span>'+esc(p.name)+'</span><span>'+fmt(p.price)+'</span></div><div class="note">'+(p.active?'نشط':'معطّل')+(p.stock!=null?' — المخزون: '+p.stock:'')+' — ?p='+esc(p.slug)+'</div><button class="chip" data-edit="'+p.id+'">تعديل</button></div>'}).join("")}
var PF=[["name","اسم المنتج","text"],["slug","الرابط (أحرف إنجليزية وأرقام و -)","text"],["price","السعر","number"],["old_price","السعر القديم (اختياري)","number"],["description","الوصف","area"],["features","المميزات (سطر لكل ميزة)","area"],["faq","أسئلة وأجوبة (سطر: سؤال | جواب)","area"],["timer_text","النص فوق العداد","text"],["duration_hours","مدة العرض بالساعات","number"],["starts_at","بداية العرض (اختياري)","datetime-local"],["ends_at","نهاية العرض (اختياري)","datetime-local"],["stock","المخزون (فارغ = غير محدود)","number"],["btn_text","نص زر الطلب","text"],["delivery_info","معلومات توصيل خاصة بالمنتج (اختياري)","area"]];
function gv(p,k){return k==="features"?(p.features||[]).join("\n"):k==="faq"?(p.faq||[]).map(function(q){return q[0]+" | "+q[1]}).join("\n"):(k==="starts_at"||k==="ends_at")?toLocal(p[k]):(p[k]==null?"":p[k])}
function sv(p,k,v,t){
 if(k==="features")p.features=v.split("\n").map(function(s){return s.trim()}).filter(Boolean);
 else if(k==="faq")p.faq=v.split("\n").map(function(l){var a=l.split("|");return[(a[0]||"").trim(),a.slice(1).join("|").trim()]}).filter(function(q){return q[0]});
 else if(k==="slug")p.slug=v.toLowerCase().replace(/[^a-z0-9-]/g,"");
 else if(t==="datetime-local")p[k]=v?new Date(v).toISOString():null;
 else if(t==="number")p[k]=v===""?null:Number(v);else p[k]=v}
function vEdit(){
 var p=AD.ed,h='<button class="chip" data-a="back">رجوع</button>';
 if(p.id)h+='<div class="note">رابط الإعلان:<br><b dir="ltr">'+esc(location.origin+location.pathname)+'?p='+esc(p.slug)+'</b></div>';
 h+='<div class="imgs">';for(var i=0;i<3;i++)h+='<div class="s">'+(p.images[i]?'<img src="'+esc(p.images[i])+'" alt=""><button data-r="'+i+'">×</button>':'صورة '+(i+1))+'</div>';
 h+='</div>'+(p.images.length<3?'<label>رفع صور من المعرض (حتى 3)<input type="file" id="up" accept="image/*" multiple></label>':'');
 PF.forEach(function(f){h+='<label>'+f[1]+(f[2]==="area"?'<textarea rows="3" data-k="'+f[0]+'">'+esc(gv(p,f[0]))+'</textarea>':'<input data-k="'+f[0]+'" data-t="'+f[2]+'" type="'+f[2]+'" value="'+esc(gv(p,f[0]))+'">')+'</label>'});
 [["timer_on","إظهار العداد التنازلي"],["whatsapp_on","إظهار زر واتساب"],["reviews_on","إظهار آراء العملاء"],["active","المنتج نشط ومعروض للزبائن"]].forEach(function(c){h+='<label class="chk"><input type="checkbox" data-c="'+c[0]+'"'+(p[c[0]]?' checked':'')+'>'+c[1]+'</label>'});
 h+='<label>آراء العملاء (سطر: الاسم | الرأي)<textarea rows="3" id="rvt">'+esc(AD.rv)+'</textarea></label><button class="btn" data-a="save">حفظ المنتج</button>';
 if(p.id)h+='<button class="btn o" style="color:var(--red);border-color:var(--red)" data-a="del">حذف المنتج</button>';return h}
function vSet(){
 return [["name","اسم المتجر"],["whatsapp","رقم واتساب (مع رمز الدولة)"],["color","لون الموقع"],["facebook","رابط فيسبوك"],["instagram","رابط إنستغرام"]].map(function(f){return '<label>'+f[1]+'<input data-sk="'+f[0]+'" '+(f[0]==="color"?'type="color" style="height:46px" ':'')+'value="'+esc(ST[f[0]]||(f[0]==="color"?"#36801a":""))+'"></label>'}).join("")+
 '<label>معلومات التوصيل<textarea rows="3" data-sk="delivery">'+esc(ST.delivery||"")+'</textarea></label><label>الشعار (رفع صورة)<input type="file" id="lg" accept="image/*"></label><button class="btn" data-a="sset">حفظ الإعدادات</button>'}
function comp(f,max){return new Promise(function(res){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.8)};i.src=r.result};r.readAsDataURL(f)})}
async function upl(f,max){var b=await comp(f,max),n="p/"+Date.now()+Math.random().toString(36).slice(2,6)+".jpg",r=await sb.storage.from("media").upload(n,b,{contentType:"image/jpeg"});
 if(r.error){toast("تعذر رفع الصورة");return null}return sb.storage.from("media").getPublicUrl(n).data.publicUrl}
function newP(){return{slug:"p"+Date.now().toString(36),name:"",price:0,old_price:null,description:"",features:[],faq:[],images:[],timer_on:false,timer_text:"العرض ينتهي عند انتهاء العداد",duration_hours:24,starts_at:null,ends_at:null,stock:null,active:true,btn_text:"اطلب الآن",whatsapp_on:true,reviews_on:false,delivery_info:""}}
async function saveP(){
 var p=AD.ed;p.name=(p.name||"").trim();if(!p.name||!p.slug){toast("أدخل اسم المنتج والرابط");return}
 var row=Object.assign({},p);delete row.created_at;delete row.id;row.delivery_info=row.delivery_info||null;var r;
 r=p.id?await sb.from("products").update(row).eq("id",p.id).select().single():await sb.from("products").insert(row).select().single();
 if(r.error){toast(r.error.code==="23505"?"هذا الرابط مستخدم لمنتج آخر":"تعذر الحفظ");return}
 var id=r.data.id;await sb.from("reviews").delete().eq("product_id",id);
 var rv=AD.rv.split("\n").map(function(l){var a=l.split("|");return{product_id:id,name:(a[0]||"").trim(),body:a.slice(1).join("|").trim(),rating:5}}).filter(function(x){return x.name&&x.body});
 if(rv.length)await sb.from("reviews").insert(rv);
 toast("تم الحفظ");await loadPub();aGo("prods")}
async function loadPub(){var r=await sb.from("products").select("*").eq("active",true).order("created_at",{ascending:false});if(r.data)PRODS=r.data}
var A=$("adm");
A.addEventListener("input",function(e){var t=e.target;
 if(t.dataset.k&&AD.ed)sv(AD.ed,t.dataset.k,t.value,t.dataset.t);if(t.dataset.sk)ST[t.dataset.sk]=t.value;if(t.id==="rvt")AD.rv=t.value;
 if(t.id==="sq"){AD.q=t.value;var p=t.selectionStart;aR();var n=$("sq");n.focus();n.setSelectionRange(p,p)}});
A.addEventListener("change",async function(e){var t=e.target;
 if(t.dataset.c&&AD.ed)AD.ed[t.dataset.c]=t.checked;
 if(t.dataset.st){var r=await sb.from("orders").update({status:t.value}).eq("id",t.dataset.st);if(r.error)toast("تعذر تحديث الحالة");else{AD.orders.forEach(function(x){if(x.id===t.dataset.st)x.status=t.value});toast("تم التحديث: "+sname(t.value));aR()}}
 if(t.id==="up"&&AD.ed){var fs=Array.prototype.slice.call(t.files,0,3-AD.ed.images.length);toast("جارٍ رفع الصور...");for(var i=0;i<fs.length;i++){var u=await upl(fs[i],1000);if(u)AD.ed.images.push(u)}aR()}
 if(t.id==="lg"&&t.files[0]){var u2=await upl(t.files[0],512);if(u2){ST.logo=u2;toast("تم رفع الشعار، اضغط حفظ الإعدادات")}}});
A.addEventListener("click",async function(e){var t=e.target.closest("button");if(!t)return;var d=t.dataset;
 if(t.id==="lo"){await sb.auth.signOut();A.className="";document.body.style.overflow="";return}
 if(d.tab)return aGo(d.tab);if(d.of){AD.of=d.of;return aR()}
 if(d.a==="new"){AD.ed=newP();AD.rv="";return aR()}
 if(d.edit){AD.ed=JSON.parse(JSON.stringify(AD.prods.filter(function(x){return x.id===d.edit})[0]));var r=await sb.from("reviews").select("*").eq("product_id",d.edit);AD.rv=(r.data||[]).map(function(x){return x.name+" | "+x.body}).join("\n");return aR()}
 if(d.a==="back")return aGo("prods");if(d.a==="save")return saveP();
 if(d.r!=null){AD.ed.images.splice(+d.r,1);return aR()}
 if(d.a==="del"&&confirm("حذف هذا المنتج نهائيًا؟")){await sb.from("products").delete().eq("id",AD.ed.id);await loadPub();return aGo("prods")}
 if(d.a==="sset"){var rows=["name","whatsapp","color","facebook","instagram","delivery","logo"].map(function(k){return{key:k,value:ST[k]||""}});
  var r2=await sb.from("settings").upsert(rows);if(r2.error)toast("تعذر الحفظ");else{applySt();toast("تم حفظ الإعدادات")}}});

/* ===== البدء ===== */
(async function(){
 $("app").innerHTML='<div class="w"><p class="desc">جارٍ التحميل...</p></div>';
 var s=await sb.from("settings").select("*");if(s.data)s.data.forEach(function(x){ST[x.key]=x.value});applySt();
 await loadPub();route()})();
})();
</script>
